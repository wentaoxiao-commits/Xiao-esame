<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" preserveAspectRatio="none" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3a43"/>
      <stop offset="1" stop-color="#17171c"/>
    </linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4e4e58"/>
      <stop offset="1" stop-color="#2a2a31"/>
    </linearGradient>
    <linearGradient id="r" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4121f"/>
      <stop offset="1" stop-color="#7d0b14"/>
    </linearGradient>
    <pattern id="v" width="6" height="10" patternUnits="userSpaceOnUse">
      <rect width="3" height="10" fill="#050507"/>
    </pattern>
    <pattern id="h" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="14" fill="#c4121f"/>
      <rect x="7" width="7" height="14" fill="#08080a"/>
    </pattern>
    <g id="bolt">
      <circle r="3.4" fill="#17171b"/>
      <circle r="2.4" fill="#8a8a94"/>
      <path d="M-1.8 0H1.8" stroke="#23232a" stroke-width="1"/>
    </g>
  </defs>

  <!-- scocca rettangolare (parte sinistra: 532 x 380) -->
  <rect x="0" y="0" width="532" height="380" fill="url(#a)"/>

  <!-- fascia alta: prese d'aria, pannello rosso, sigla, riquadro dell'invito -->
  <rect x="12" y="8" width="508" height="38" fill="url(#b)" stroke="#08080a" stroke-width="2"/>
  <path d="M14 10 H518" stroke="#7a7a86" stroke-opacity=".6"/>
  <rect x="22" y="17" width="82" height="20" fill="url(#v)" opacity=".85"/>
  <polygon points="130,9 208,9 194,45 116,45" fill="url(#r)" stroke="#08080a" stroke-width="1.5"/>
  <text x="146" y="37" font-family="Impact, 'Arial Narrow Bold', sans-serif" font-size="20" fill="#f2f2f4" letter-spacing="2">01</text>
  <text x="222" y="31" font-family="'Courier New', monospace" font-size="8" fill="#b4b4bc" letter-spacing="2">MK-01 / ARMOR</text>
  <polygon points="322,11 504,11 504,43 322,43" fill="#0e0e11" stroke="#6a6a74" stroke-width="2"/>
  <use href="#bolt" x="512" y="27"/>
  <use href="#bolt" x="20" y="27"/>

  <!-- fascia bassa: prese d'aria, zona di pericolo, sigla -->
  <rect x="12" y="336" width="508" height="36" fill="url(#b)" stroke="#08080a" stroke-width="2"/>
  <rect x="24" y="345" width="86" height="18" fill="url(#v)" opacity=".85"/>
  <rect x="134" y="345" width="92" height="18" fill="url(#h)" stroke="#08080a" stroke-width="1"/>
  <text x="248" y="358" font-family="'Courier New', monospace" font-size="8" fill="#a0a0a8" letter-spacing="2">PILOT ON BOARD</text>
  <use href="#bolt" x="420" y="354"/>
  <use href="#bolt" x="512" y="354"/>

  <!-- fianco sinistro -->
  <rect x="6" y="54" width="22" height="280" fill="url(#b)" stroke="#08080a" stroke-width="2"/>
  <use href="#bolt" x="17" y="72"/>
  <use href="#bolt" x="17" y="194"/>
  <use href="#bolt" x="17" y="316"/>

  <!-- cornice dello schermo (contenuto) -->
  <rect x="33" y="53" width="430" height="276" fill="none" stroke="#06060a" stroke-width="3"/>
  <path d="M34.5 54.5 H461.5 V327.5" fill="none" stroke="#5a5a64" stroke-opacity=".55"/>
  <use href="#bolt" x="470" y="62"/>
  <use href="#bolt" x="470" y="320"/>

  <!-- colonna delle baie: piastra con le quattro fessure numerate -->
  <rect x="468" y="50" width="64" height="280" fill="url(#b)" stroke="#08080a" stroke-width="2"/>
  <rect x="468" y="50" width="64" height="8" fill="url(#r)"/>
  <g font-family="'Courier New', monospace" font-size="10" fill="#b4b4bc" letter-spacing="1">
    <text x="476" y="71">01</text>
    <text x="476" y="153">02</text>
    <text x="476" y="235">03</text>
    <text x="476" y="317">04</text>
  </g>

  <!-- cornici delle quattro fessure (il bordo è tagliato dalla sagoma: resta la metà interna) -->
  <g fill="none" stroke="#050507" stroke-width="7" stroke-linejoin="miter">
    <path d="M532 35 H502 V99 H532"/>
    <path d="M532 117 H502 V181 H532"/>
    <path d="M532 199 H502 V263 H532"/>
    <path d="M532 281 H502 V345 H532"/>
  </g>
  <g fill="none" stroke="#8a8a96" stroke-opacity=".6" stroke-width="1.2">
    <path d="M532 38.5 H505.5 V95.5 H532"/>
    <path d="M532 120.5 H505.5 V177.5 H532"/>
    <path d="M532 202.5 H505.5 V259.5 H532"/>
    <path d="M532 284.5 H505.5 V341.5 H532"/>
  </g>

  <!-- contorno e spigoli illuminati -->
  <path d="M14 1 H518 L531 14 V366 L518 379 H14 L1 366 V14 Z" fill="none" stroke="#050507" stroke-width="3"/>
  <path d="M3 14 L14 3 H518 M3 366 L14 377" stroke="#8a8a96" stroke-opacity=".7" stroke-width="1.4" fill="none"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
