<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="pn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16161c"/>
      <stop offset="1" stop-color="#0c0c10"/>
    </linearGradient>
    <linearGradient id="tb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22222a"/>
      <stop offset="1" stop-color="#0a0a0d"/>
    </linearGradient>
    <!-- pannello d'armatura con giunti e bulloni agli angoli -->
    <pattern id="wall" width="200" height="150" patternUnits="userSpaceOnUse">
      <rect width="200" height="150" fill="url(#pn)"/>
      <path d="M0 0H200M0 0V150" stroke="#040406" stroke-width="4"/>
      <path d="M0 3H200M3 0V150" stroke="#2c2c34" stroke-opacity=".6"/>
      <g fill="#2c2c34"><circle cx="14" cy="14" r="3.4"/><circle cx="186" cy="14" r="3.4"/><circle cx="14" cy="136" r="3.4"/><circle cx="186" cy="136" r="3.4"/></g>
      <g fill="#50505a"><circle cx="14" cy="14" r="1.4"/><circle cx="186" cy="14" r="1.4"/><circle cx="14" cy="136" r="1.4"/><circle cx="186" cy="136" r="1.4"/></g>
    </pattern>
    <pattern id="hz" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="28" fill="#b0121f"/>
      <rect x="14" width="14" height="28" fill="#08080a"/>
    </pattern>
    <pattern id="vt" width="10" height="9" patternUnits="userSpaceOnUse">
      <rect width="10" height="4" fill="#040406"/>
    </pattern>
    <radialGradient id="glow" cx=".5" cy=".52" r=".42">
      <stop offset="0" stop-color="#8c0c18" stop-opacity=".28"/>
      <stop offset="1" stop-color="#8c0c18" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx=".5" cy=".5" r=".75">
      <stop offset=".35" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".88"/>
    </radialGradient>
    <filter id="bl" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- parete a pannelli -->
  <rect width="1600" height="900" fill="url(#wall)"/>
  <g fill="#fff" fill-opacity=".022">
    <rect x="200" y="150" width="200" height="150"/>
    <rect x="1000" y="300" width="200" height="150"/>
    <rect x="400" y="600" width="200" height="150"/>
    <rect x="1200" y="150" width="200" height="150"/>
  </g>
  <g fill="#000" fill-opacity=".25">
    <rect x="600" y="150" width="200" height="150"/>
    <rect x="0" y="450" width="200" height="150"/>
    <rect x="1400" y="600" width="200" height="150"/>
  </g>

  <!-- condotti orizzontali con staffe -->
  <g>
    <rect x="0" y="288" width="1600" height="18" fill="url(#tb)"/>
    <path d="M0 290H1600" stroke="#4a4a54" stroke-opacity=".55"/>
    <rect x="0" y="618" width="1600" height="18" fill="url(#tb)"/>
    <path d="M0 620H1600" stroke="#4a4a54" stroke-opacity=".55"/>
    <g fill="#08080b" stroke="#2c2c34">
      <rect x="140" y="282" width="22" height="30"/><rect x="540" y="282" width="22" height="30"/><rect x="940" y="282" width="22" height="30"/><rect x="1340" y="282" width="22" height="30"/>
      <rect x="340" y="612" width="22" height="30"/><rect x="740" y="612" width="22" height="30"/><rect x="1140" y="612" width="22" height="30"/><rect x="1480" y="612" width="22" height="30"/>
    </g>
  </g>

  <!-- prese d'aria -->
  <g opacity=".8">
    <rect x="70" y="120" width="190" height="78" fill="url(#vt)"/>
    <rect x="1330" y="370" width="200" height="86" fill="url(#vt)"/>
    <rect x="250" y="700" width="210" height="80" fill="url(#vt)"/>
    <rect x="1010" y="130" width="170" height="70" fill="url(#vt)"/>
  </g>
  <g fill="none" stroke="#2c2c34" stroke-width="2">
    <rect x="70" y="120" width="190" height="78"/><rect x="1330" y="370" width="200" height="86"/>
    <rect x="250" y="700" width="210" height="80"/><rect x="1010" y="130" width="170" height="70"/>
  </g>

  <!-- tracce di circuito rosse molto tenui -->
  <g fill="none" stroke="#e11d2e" stroke-opacity=".32" stroke-width="1.6">
    <polyline points="0,400 180,400 220,440 540,440 580,400 760,400"/>
    <polyline points="1600,520 1380,520 1340,560 1060,560 1020,520 900,520"/>
    <polyline points="300,806 300,760 340,720 620,720"/>
    <polyline points="1300,90 1300,140 1260,180 980,180"/>
  </g>
  <g fill="#e11d2e" fill-opacity=".6">
    <circle cx="760" cy="400" r="3"/><circle cx="900" cy="520" r="3"/><circle cx="620" cy="720" r="3"/><circle cx="980" cy="180" r="3"/>
  </g>

  <!-- travi alta e bassa con strisce di pericolo -->
  <rect x="0" y="0" width="1600" height="66" fill="url(#tb)"/>
  <rect x="0" y="66" width="1600" height="10" fill="url(#hz)" opacity=".55"/>
  <rect x="0" y="824" width="1600" height="10" fill="url(#hz)" opacity=".55"/>
  <rect x="0" y="834" width="1600" height="66" fill="url(#tb)"/>
  <path d="M0 64H1600M0 836H1600" stroke="#040406" stroke-width="4"/>
  <g font-family="'Courier New', monospace" font-size="12" fill="#4a4a54" letter-spacing="4">
    <text x="40" y="44">HANGAR // SETTORE 04</text>
    <text x="1560" y="44" text-anchor="end">BAIA 07 // STATO: ONLINE</text>
    <text x="40" y="870">RX-01</text>
    <text x="1560" y="870" text-anchor="end">ATTENZIONE: ARMATURA IN MOVIMENTO</text>
  </g>

  <!-- spie rosse (con alone) -->
  <g fill="#ff4d5a">
    <circle cx="1500" cy="38" r="12" filter="url(#bl)" opacity=".7"/><circle cx="1500" cy="38" r="3.2"/>
    <circle cx="100" cy="868" r="12" filter="url(#bl)" opacity=".7"/><circle cx="100" cy="868" r="3.2"/>
  </g>

  <!-- alone dietro la card e vignettatura ai bordi -->
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#vig)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
