<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="r" x1="0" x2="1">
      <stop offset="0" stop-color="#ff7a84"/>
      <stop offset=".45" stop-color="#e11d2e"/>
      <stop offset="1" stop-color="#3a0309"/>
    </linearGradient>
    <pattern id="v" width="7" height="16" patternUnits="userSpaceOnUse">
      <rect width="3" height="16" fill="#000"/>
    </pattern>
    <radialGradient id="vig" cx=".5" cy=".5" r=".75">
      <stop offset=".4" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".75"/>
    </radialGradient>
    <filter id="g" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#07070a"/>

  <!-- Tutto è disegnato in orizzontale e poi ruotato di 45° -->
  <g transform="translate(800 450) rotate(-45)">
    <!-- piastre d'acciaio -->
    <rect x="-1100" y="-1000" width="2200" height="440" fill="#0b0b0f"/>
    <polygon points="-1100,-560 300,-560 340,-520 1100,-520 1100,-420 -1100,-420" fill="#1a1a20"/>
    <rect x="-1100" y="-420" width="2200" height="170" fill="#2b2b32"/>
    <rect x="-1100" y="-250" width="2200" height="35" fill="#040406"/>
    <polygon points="-1100,-215 -250,-215 -210,-255 1100,-255 1100,60 -1100,60" fill="#3b3b43"/>
    <rect x="-1100" y="60" width="2200" height="40" fill="#040406"/>
    <polygon points="-1100,100 500,100 540,140 1100,140 1100,330 -1100,330" fill="#18181e"/>
    <rect x="-1100" y="330" width="2200" height="30" fill="#040406"/>
    <rect x="-1100" y="360" width="2200" height="640" fill="#262629"/>

    <!-- strisce rosse luminose -->
    <g id="s">
      <polygon points="-380,-250 40,-250 20,-228 -400,-228" fill="url(#r)"/>
      <polygon points="300,-215 630,-215 612,-201 282,-201" fill="url(#r)"/>
      <polygon points="-760,60 -280,60 -296,76 -776,76" fill="url(#r)"/>
      <polygon points="150,330 510,330 490,350 130,350" fill="url(#r)"/>
    </g>
    <use href="#s" filter="url(#g)" opacity=".8"/>

    <!-- linee sottili da circuito -->
    <g fill="none" stroke="#e11d2e" stroke-opacity=".55" stroke-width="1.6">
      <polyline points="-900,-330 -560,-330 -520,-370 -140,-370 -100,-410 300,-410"/>
      <polyline points="-300,-180 100,-180 140,-140 520,-140"/>
      <polyline points="200,130 600,130 640,170 900,170"/>
      <polyline points="-700,250 -300,250 -260,290 100,290"/>
      <path d="M-60 -520V-420M700 60V330"/>
    </g>

    <!-- prese d'aria e pixel -->
    <g opacity=".6">
      <rect x="-640" y="-390" width="100" height="30" fill="url(#v)"/>
      <rect x="420" y="-180" width="90" height="26" fill="url(#v)"/>
      <rect x="-120" y="150" width="100" height="26" fill="url(#v)"/>
    </g>
    <g fill="#e11d2e" opacity=".7">
      <rect x="-200" y="-300" width="8" height="8"/>
      <rect x="-186" y="-286" width="8" height="8"/>
      <rect x="560" y="-480" width="8" height="8"/>
      <rect x="-520" y="200" width="8" height="8"/>
    </g>
  </g>

  <!-- vignettatura: scurisce i bordi per far leggere meglio il contenuto -->
  <rect width="1600" height="900" fill="url(#vig)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
